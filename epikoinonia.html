<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Επικοινωνία | Γιώργος Βαρσάμης</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap&subset=greek" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <style>
   .contact-main {max-width: 320px;
  margin: 2rem auto;
  padding: 1.5rem;
  background: #ffffff;
  border-radius: 8px;
  align-content: center;
  
}
  
  label {
     display: block;
  margin-top: 1rem;
  font-weight: 600;
  }

  input textarea {
    width: 100%;
  padding: 0.6rem 0.75rem;
  border: 1px solid #ccc;
  border-radius: 4px;
  font: inherit;
  box-sizing: border-box;
  }

  button {
    margin-top: 1.5rem;
  padding: 0.6rem 1.4rem;
  background: #1da2d8;
  color: #fff;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  width: 100%;
  box-sizing: border-box;
  }

  button:hover {
  background: #1586b4;
}

</style>
</head>
<body>
    <header> <nav>
    <a href="./index.html">Αρχική</a>
    <a href="./psaria.html">Είδη ψαριών</a>
    <a href="./technikes.html">Τεχνικές ψαρέματος</a>
    <a href="./epikoinonia.html">Επικοινωνία</a>
  </nav> </header>
  <main class="contact-main">
    <section>
    <h1>Επικοινωνία</h1>
    <p>Στείλτε μήνυμα για απορίες, προτάσεις ή συνεργασίες</p>
    <form action="https://formspree.io/f/mdannnzo" method="post">
      <label for="name">Όνομα</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="subject">Θέμα</label>
      <input type="text" id="subject" name="subject">

      <label for="message">Μήνυμα</label>
       <textarea id="message" name="message" rows="5" required></textarea>
       <button type="submit">Αποστολή</button>
    </form>
    <p id="form-status" aria-live="polite"></p>
    <script>
       const form = document.getElementById('contact-form');
       const status = document.getElementById('form-status');
       form.addEventListener('submit', async (e) => {
        e.preventDefault();
         status.textContent = 'Γίνεται αποστολή...';
          try {
      const data = new FormData(form);
      const res = await fetch('https://formspree.io/f/ΤΟ_ID_ΣΟΥ', {
        method: 'POST',
        body: data,
        headers: { 'Accept': 'application/json' }
      });

       if (res.ok) {
        status.textContent = 'Το μήνυμά σου στάλθηκε, ευχαριστώ!';
        form.reset();
      } else {
        status.textContent = 'Κάτι πήγε λάθος, δοκίμασε ξανά.';
      }
    } catch (err) {
      status.textContent = 'Σφάλμα σύνδεσης, δοκίμασε αργότερα.';
    }
  });
    </script>
  </section></main>
</body>
</html>
