<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Επικοινωνία | Γιώργος Βαρσάμης</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&subset=greek&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
       <div class="logo">Γιώργος Βαρσάμης</div>
      <nav>
        <ul>
          <li><a href="./index.html">Αρχική</a></li>
          <li><a href="./psaria.html">Είδη ψαριών</a></li>
          <li><a href="./technikes.html">Τεχνικές ψαρέματος</a></li>
          <li><a href="./epikoinonia.html">Επικοινωνία</a></li>
        </ul>
      </nav>
    </header>
  <main  class="container my-5">
    <section>
    <h1 class="text-center mb-4">Επικοινωνία</h1>
    <p class="text-center mb-4" >Στείλτε μήνυμα για απορίες, προτάσεις ή συνεργασίες</p>
    <form action="https://formspree.io/f/mdannnzo" method="post"
        class="mx-auto" style="max-width: 400px;">
    <div class="mb-3">
      <label for="name" class="form-label">Όνομα</label>
      <input type="text" id="name" name="name"
             class="form-control" required>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" id="email" name="email"
             class="form-control" required>
    </div>

    <div class="mb-3">
      <label for="subject" class="form-label">Θέμα</label>
      <input type="text" id="subject" name="subject"
             class="form-control">
    </div>

    <div class="mb-3">
      <label for="message" class="form-label">Μήνυμα</label>
      <textarea id="message" name="message" rows="5"
                class="form-control" required></textarea>
    </div>

    <button type="submit" class="btn btn-info text-white w-100">
      Αποστολή
    </button>
  </form>
    <p id="form-status" aria-live="polite"></p>
    <script>
       const form = document.getElementById('contact-form');
       const status = document.getElementById('form-status');
       form.addEventListener('submit', async (e) => {
        e.preventDefault();
         status.textContent = 'Γίνεται αποστολή...';
          try {
      const data = new FormData(form);
      const res = await fetch('https://formspree.io/f/mdannnzo', {
        method: 'POST',
        body: data,
        headers: { 'Accept': 'application/json' }
      });

       if (res.ok) {
        status.textContent = 'Το μήνυμά σου στάλθηκε, ευχαριστώ!';
        form.reset();
      } else {
        status.textContent = 'Κάτι πήγε λάθος, δοκίμασε ξανά.';
      }
    } catch (err) {
      status.textContent = 'Σφάλμα σύνδεσης, δοκίμασε αργότερα.';
    }
  });
    </script>
  </section></main>
</body>
</html>
